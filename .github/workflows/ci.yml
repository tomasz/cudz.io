name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the gitleaks scan.
          fetch-depth: 0
          persist-credentials: false
      # CI runs in the devcontainer everyone develops in: same image, same bin/setup.
      - run: npx --yes @devcontainers/cli@0.89.0 up --workspace-folder .
      - run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . bash -c 'vp run ready && gitleaks git --redact --no-banner'

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
